services:
  - type: web
    name: draftdock-admin-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd apps/admin/server && npm install && npx prisma generate
    startCommand: node apps/admin/server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: draftdock-admin-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_JWT_SECRET
        generateValue: true # Render will generate a random secret

databases:
  - name: draftdock-admin-db
    plan: free
