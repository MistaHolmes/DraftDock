server {
  listen 8080;
  # Listen for both current and future frontend hostnames used during migration
  server_name localhost draftdock.abhasbehera.in draftdock.in www.draftdock.in;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }
}
