services:
  # Backend Application
  # Redis is now on Redis Cloud — REDIS_URL is passed via environment or .env
  backend:
    image: mistaholmes/draftdock-be-mar-21
    container_name: draftdock-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
      COLLAB_PORT: 3002
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    networks:
      - draftdock-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy — handles HTTP + WebSocket upgrade
  nginx:
    image: nginx:alpine
    container_name: draftdock-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - draftdock-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nginx_logs:
    driver: local

networks:
  draftdock-network:
    driver: bridge

configs:
  nginx_config:
    content: |
      events {
          worker_connections 1024;
      }

      http {
          map $$http_upgrade $$connection_upgrade {
              default upgrade;
              '' close;
          }

          upstream api_backend {
              server backend:3000;
              keepalive 32;
          }

          upstream ws_backend {
              server backend:3001;
              keepalive 16;
          }

          upstream collab_backend {
              server backend:3002;
              keepalive 16;
          }

          server {
              listen 80;
              server_name _;

              location /health {
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  access_log off;
              }

              location /ws {
                  proxy_pass http://ws_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection $$connection_upgrade;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }

              location /collab {
                  proxy_pass http://collab_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection $$connection_upgrade;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }

              location /api/ {
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  proxy_set_header Connection "";
              }

              location / {
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }
          }
      }
