services:
  # Backend Application
  # Redis is now on Redis Cloud — REDIS_URL is passed via environment or .env
  backend:
    build: .
    image: mistaholmes/draftdock-be-mar-21
    container_name: draftdock-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
    ports:
      - "3000:3000"   # HTTP / REST API & WebSocket
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge
