services:
  # ── Backend Application ─────────────────────────────────────────────────────
  # Redis is on Redis Cloud — REDIS_URL passed via .env
  # PostgreSQL is on Neon — DATABASE_URL passed via .env
  backend:
    image: mistaholmes/draftdock-be-mar-21
    container_name: draftdock-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
    ports:
      - "3000:3000"
      - "3001:3001"
    networks:
      - draftdock-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  # Routes /api/* and /health → backend:3000 (HTTP)
  # Routes /ws             → backend:3001 (WebSocket)
  nginx:
    image: nginx:alpine
    container_name: draftdock-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - draftdock-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nginx_logs:
    driver: local

networks:
  draftdock-network:
    driver: bridge
