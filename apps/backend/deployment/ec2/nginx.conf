events {
    worker_connections 1024;
}

http {
    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstream: HTTP API on port 3000 ───────────────────────────────────────
    upstream api_backend {
        server backend:3000;
        keepalive 32;
    }

    # ── Upstream: WebSocket on port 3001 ──────────────────────────────────────
    upstream ws_backend {
        server backend:3001;
        keepalive 16;
    }

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── Health check (no logging) ─────────────────────────────────────────
        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            access_log off;
        }

        location /version {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            access_log off;
        }

        # ── WebSocket endpoint → backend:3001 ────────────────────────────────
        location /ws {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep WS connections alive (1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # No buffering for real-time
            proxy_buffering off;
        }

        # ── REST API → backend:3000 ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Enable keepalive to backend
            proxy_set_header Connection "";
        }

        # ── Redis test endpoint ───────────────────────────────────────────────
        location /redis-test {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Catch-all → 404 ──────────────────────────────────────────────────
        location / {
            return 404 '{"error": "Not Found"}';
            add_header Content-Type application/json;
        }
    }

    # ── HTTPS server (uncomment when SSL certs are ready) ─────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
