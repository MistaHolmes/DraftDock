
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  client_max_body_size 50m;

  # ── HTTP API / Frontend routing — accept both current hostname and
  #     the future `draftdock.in` domain plus common subdomains.
  server {
    listen 80;
    server_name draftdock.abhasbehera.in draftdock.in www.draftdock.in;
    access_log /var/log/nginx/draftdock.access.log;

    root /var/www/draftdock;
    index index.html;

    # Serve static files and fall back to index.html for client-side routing
    location / {
      try_files $uri $uri/ /index.html;
      expires max;
      add_header Cache-Control "public, must-revalidate";
    }
  }

  server {
    listen 80;
    server_name draftdock-be.abhasbehera.in draftdock-be.draftdock.in *.draftdock.in;
    access_log /var/log/nginx/access.log;

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 60s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
      proxy_buffering off;
    }

    location /health {
      proxy_pass http://127.0.0.1:3000/health;
      proxy_set_header Host $host;
    }
  }

  # ── WebSocket ── wss-draftdock.be.abhasbehera.in => backend port 3001 ────
  server {
    listen 80;
    server_name wss-draftdock.be.abhasbehera.in wss-draftdock-be.draftdock.in *.draftdock.in;
    access_log /var/log/nginx/access.log;

    location / {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }

  # ── Collaboration WebSocket ── collab-draftdock.be.abhasbehera.in => port 3002 ──
  server {
    listen 80;
    server_name collab-draftdock.be.abhasbehera.in collab-draftdock-be.draftdock.in *.draftdock.in;
    access_log /var/log/nginx/collab.access.log;

    location / {
      proxy_pass http://127.0.0.1:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }

  # ── Default: drop unknown hosts ───────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}
